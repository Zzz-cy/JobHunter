server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 简历 PDF 上传可能 10MB 级, 默认 1m 会 413
    client_max_body_size 20m;

    # llm_module Agent 接口(对应 vite 代理: 去 /api 前缀)
    location /api/agents/ {
        proxy_pass http://llm:8001/agents/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # 简历 LLM 解析要 1 分钟级
    }

    # llm_module v1 监控接口(对应 vite 代理: 保留 /api 前缀)
    location /api/v1/ {
        proxy_pass http://llm:8001;
        proxy_set_header Host $host;
    }

    # 主后端(对应 vite 代理: 去 /api 前缀)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # 推荐 LLM 重排较慢
    }

    # 前端 SPA(history 模式路由回退)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
